# Configuracion NGINX para Balanceo Avanzado, Tolerancia a Fallos y Monitoreo (APE 03)
worker_processes  1;

error_log  logs/error.log  notice;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Formato de log dedicado con metricas completas para monitor-balancer-service
    # Formato delimitado por pipes: time_iso8601|method|uri|status|upstream_addr|upstream_status|request_time|upstream_response_time
    log_format monitor_format '$time_iso8601|$request_method|$request_uri|$status|$upstream_addr|$upstream_status|$request_time|$upstream_response_time';

    access_log logs/access.log monitor_format;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream ponderado 3:1 con tolerancia a fallos pasiva
    upstream vehiculos_backend {
        server 127.0.0.1:8080 weight=3 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8082 weight=1 max_fails=1 fail_timeout=5s;
    }

    server {
        listen       127.0.0.1:8090;
        server_name  localhost;

        # Endpoint local de diagnostico /nginx-ping (excluido de metricas de negocio)
        location = /nginx-ping {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","mensaje":"NGINX funcionando correctamente","timestamp":"$time_iso8601"}';
        }

        # Enrutamiento principal hacia el upstream de vehiculos
        location / {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Timeouts finitos para tolerancia a fallos
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;

            # Reintento automatico sobre el siguiente upstream en caso de error
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
