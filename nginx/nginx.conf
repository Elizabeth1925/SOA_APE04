# Configuracion NGINX para Arquitectura Multicanal SOA (APE 04)
# Balanceo ponderado 3:1 de vehiculos, enrutamiento a FastAPI y Notificaciones, y logging seguro
worker_processes  1;

error_log  logs/error.log  notice;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Formato de log dedicado con metricas completas para monitor-balancer-service
    # CORREGIDO: Se utiliza $uri en lugar de $request_uri para evitar el registro de parametros de consulta sensibles
    log_format monitor_format '$time_iso8601|$request_method|$uri|$status|$upstream_addr|$upstream_status|$request_time|$upstream_response_time';

    access_log logs/access.log monitor_format;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream ponderado 3:1 con tolerancia a fallos pasiva para la API de Vehiculos en Spring Boot
    upstream vehiculos_backend {
        server 127.0.0.1:8080 weight=3 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8082 weight=1 max_fails=1 fail_timeout=5s;
    }

    server {
        listen       127.0.0.1:8090;
        server_name  localhost;

        # Endpoint local de diagnostico /nginx-ping (excluido de metricas de negocio)
        location = /nginx-ping {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","mensaje":"NGINX funcionando correctamente","timestamp":"$time_iso8601"}';
        }

        # Rutas de la API de Compradores y Ventas hacia Python FastAPI (Puerto 8002)
        location /api/compradores {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }

        location /api/ventas {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }

        # Rutas del Servicio de Notificaciones en Spring Boot (Puerto 8081)
        location /api/notificaciones {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }

        # Enrutamiento hacia el upstream de Vehiculos (Autenticacion, Catalogo y Actuator)
        location /oauth/token {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location /actuator/health {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # Enrutamiento general por defecto hacia upstream de vehiculos
        location / {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;

            # Reintento automatico sobre el siguiente upstream en caso de error
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
