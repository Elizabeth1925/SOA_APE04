# ==============================================================================
# ARCHIVO: nginx.conf
# COMPONENTE: NGINX Reverse Proxy y Balanceador de Carga (Puerto 8090)
# ROL: Punto unico de entrada HTTP REST para toda la arquitectura SOA APE 04.
#      Distribuye carga ponderada 3:1 sobre las dos instancias de Vehiculos
#      (Spring Boot :8080 y :8082) con tolerancia pasiva a fallos, enruta de
#      forma desacoplada Compradores/Ventas hacia FastAPI (:8002) y Notificaciones
#      hacia Spring Boot (:8081), expone /nginx-ping y genera access.log seguro
#      para monitor-balancer-service (:8083).
# ACTIVIDADES APE 04 CUBIERTAS:
#   - [Actividad 3]: Punto unico REST en :8090, upstream ponderado 3:1,
#     desconexion pasiva (max_fails=1, fail_timeout=5s, proxy_next_upstream),
#     endpoint local /nginx-ping (200 UP) y log estructurado monitor_format
#     usando $uri (sin query strings sensibles).
#   - [Actividad 8 y Actividad 9]: Enrutamiento hacia /api/compradores,
#     /api/ventas (:8002) y /api/notificaciones (:8081) preservando cabeceras
#     Authorization e Idempotency-Key.
#   - [Actividad 11 - P23/P24/P25/P26]: Alimenta los calculos de balanceo,
#     estadisticas, failover automatico y estado de salud consultados por
#     monitor-balancer-service.
# ==============================================================================

# Configuracion NGINX para Arquitectura Multicanal SOA (APE 04)
# Balanceo ponderado 3:1 de vehiculos, enrutamiento a FastAPI y Notificaciones, y logging seguro

# Define 1 proceso trabajador de NGINX (adecuado para ejecucion local controlada en Windows).
worker_processes  1;

# Archivo de registro de errores y diagnostico de NGINX con nivel de detalle "notice".
error_log  logs/error.log  notice;
# Archivo donde NGINX guarda el identificador de proceso (PID) del proceso maestro.
pid        logs/nginx.pid;

# Bloque de configuracion del modelo de eventos y concurrencia de conexiones.
events {
    # Maximo de conexiones simultaneas atendidas por cada proceso worker.
    worker_connections  1024;
}

# Bloque principal de configuracion del servidor HTTP y proxy inverso.
http {
    # Incluye la tabla estandar de tipos MIME por extension de archivo.
    include       mime.types;
    # Tipo MIME binario por defecto cuando no existe correspondencia en mime.types.
    default_type  application/octet-stream;

    # [Actividad 3 y Actividad 11] Formato de log dedicado con metricas completas para monitor-balancer-service.
    # Campos separados por "|": marca ISO-8601, metodo HTTP, ruta sin query string ($uri), codigo de respuesta,
    # upstream(s) intentados, estado del upstream, tiempo total y tiempo de respuesta del backend.
    # CORREGIDO: Se utiliza $uri en lugar de $request_uri para evitar el registro de parametros de consulta sensibles.
    log_format monitor_format '$time_iso8601|$request_method|$uri|$status|$upstream_addr|$upstream_status|$request_time|$upstream_response_time';

    # [Actividad 3 y Actividad 11] Activa la escritura de todas las peticiones HTTP en logs/access.log con el formato monitor_format.
    access_log logs/access.log monitor_format;

    # Optimiza la transferencia de archivos estaticos usando la llamada al sistema sendfile.
    sendfile        on;
    # Tiempo maximo en segundos para mantener abiertas conexiones HTTP persistentes (keep-alive).
    keepalive_timeout  65;

    # [Actividad 3 y Actividad 11 - P23/P24/P25/P26] Upstream ponderado 3:1 con tolerancia a fallos pasiva para la API de Vehiculos en Spring Boot.
    upstream vehiculos_backend {
        # Instancia A (puerto 8080): peso 3 (75% del trafico teorico); si falla 1 vez se marca inactiva 5s (desconexion pasiva).
        server 127.0.0.1:8080 weight=3 max_fails=1 fail_timeout=5s;
        # Instancia B (puerto 8082): peso 1 (25% del trafico teorico); si falla 1 vez se marca inactiva 5s (desconexion pasiva).
        server 127.0.0.1:8082 weight=1 max_fails=1 fail_timeout=5s;
    }

    # Servidor virtual unico que centraliza el trafico REST entrante de clientes y servicios.
    server {
        # [Actividad 3] Escucha exclusivamente en loopback puerto 8090 como punto unico de entrada REST.
        listen       127.0.0.1:8090;
        # Nombre de host atendido por este servidor virtual.
        server_name  localhost;

        # [Actividad 3 y Actividad 11 - P23] Endpoint local de diagnostico /nginx-ping sondeado cada 5s por monitor-balancer-service.
        location = /nginx-ping {
            # Desactiva el registro en access.log para no contaminar las estadisticas de trafico de negocio.
            access_log off;
            # Establece el encabezado Content-Type de respuesta como JSON.
            default_type application/json;
            # Retorna inmediatamente HTTP 200 con cuerpo JSON {"status":"UP",...} validado por HealthCheckClient.
            return 200 '{"status":"UP","mensaje":"NGINX funcionando correctamente","timestamp":"$time_iso8601"}';
        }

        # [Actividad 3 y Actividad 8] Enrutamiento desacoplado de la API de Compradores hacia Python FastAPI (Puerto 8002).
        location /api/compradores {
            # Reenvia las solicitudes de compradores al microservicio ventas-api en :8002.
            proxy_pass http://127.0.0.1:8002;
            # Preserva la cabecera Host original enviada por el cliente.
            proxy_set_header Host $host;
            # Envia la direccion IP real del cliente al backend.
            proxy_set_header X-Real-IP $remote_addr;
            # Agrega la IP del cliente a la cadena de proxies X-Forwarded-For.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Informa al backend el protocolo original utilizado (http/https).
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga el token Bearer JWT necesario para autorizacion en FastAPI.
            proxy_set_header Authorization $http_authorization;
            # Propaga la cabecera Idempotency-Key para control de operaciones idempotentes.
            proxy_set_header Idempotency-Key $http_idempotency_key;

            # Tiempo maximo de espera para establecer conexion TCP con FastAPI (2 segundos).
            proxy_connect_timeout 2s;
            # Tiempo maximo de espera de lectura de respuesta desde FastAPI (15 segundos).
            proxy_read_timeout 15s;
        }

        # [Actividad 3 y Actividad 8] Enrutamiento desacoplado de la API de Ventas hacia Python FastAPI (Puerto 8002).
        location /api/ventas {
            # Reenvia las solicitudes de ventas al microservicio ventas-api en :8002.
            proxy_pass http://127.0.0.1:8002;
            # Preserva la cabecera Host original enviada por el cliente.
            proxy_set_header Host $host;
            # Envia la direccion IP real del cliente al backend.
            proxy_set_header X-Real-IP $remote_addr;
            # Agrega la IP del cliente a la cadena de proxies X-Forwarded-For.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Informa al backend el esquema HTTP original.
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga la cabecera Authorization (Bearer JWT) hacia FastAPI.
            proxy_set_header Authorization $http_authorization;
            # Propaga Idempotency-Key indispensable para evitar ventas duplicadas ante reintentos.
            proxy_set_header Idempotency-Key $http_idempotency_key;

            # Tiempo maximo de conexion TCP con ventas-api (2 segundos).
            proxy_connect_timeout 2s;
            # Tiempo maximo de lectura esperando la orquestacion completa de reserva/venta/confirmacion (15 segundos).
            proxy_read_timeout 15s;
        }

        # [Actividad 3, Actividad 8 y Actividad 9] Enrutamiento desacoplado hacia el Servicio de Notificaciones en Spring Boot (Puerto 8081).
        location /api/notificaciones {
            # Reenvia las consultas de historial (GET) y avisos directos (POST) a notificaciones-service en :8081.
            proxy_pass http://127.0.0.1:8081;
            # Preserva la cabecera Host original.
            proxy_set_header Host $host;
            # Envia la direccion IP real del cliente.
            proxy_set_header X-Real-IP $remote_addr;
            # Mantiene la trazabilidad de proxies en X-Forwarded-For.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Propaga el protocolo original (http).
            proxy_set_header X-Forwarded-Proto $scheme;
            # Reenvia la cabecera Authorization si el cliente la incluye.
            proxy_set_header Authorization $http_authorization;

            # Tiempo maximo de conexion TCP hacia notificaciones-service (2 segundos).
            proxy_connect_timeout 2s;
            # Tiempo maximo de espera de respuesta desde notificaciones-service (15 segundos).
            proxy_read_timeout 15s;
        }

        # [Actividad 3 y Actividad 11] Enrutamiento del endpoint de emision de tokens OAuth2/JWT hacia el upstream balanceado de Vehiculos.
        location /oauth/token {
            # Balancea la autenticacion entre las instancias 8080 (peso 3) y 8082 (peso 1).
            proxy_pass http://vehiculos_backend;
            # Preserva la cabecera Host original.
            proxy_set_header Host $host;
            # Envia la IP real del cliente.
            proxy_set_header X-Real-IP $remote_addr;
            # Actualiza X-Forwarded-For con la IP del cliente.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Informa el esquema original al backend Spring Boot.
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga la cabecera Authorization (por ejemplo autenticacion basica o credenciales).
            proxy_set_header Authorization $http_authorization;

            # Timeout de conexion TCP con la instancia seleccionada (2 segundos).
            proxy_connect_timeout 2s;
            # Timeout de lectura de respuesta de autenticacion (15 segundos).
            proxy_read_timeout 15s;
            # [Actividad 3 y Actividad 11 - P25] Si falla una instancia por error de red, timeout o 502/503/504, conmuta automaticamente a la otra.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # Limita los reintentos a maximo 2 instancias del upstream (8080 y 8082).
            proxy_next_upstream_tries 2;
        }

        # [Actividad 3 y Actividad 11] Enrutamiento del endpoint de salud Actuator a traves del upstream balanceado de Vehiculos.
        location /actuator/health {
            # Balancea la consulta de salud entre las instancias activas del upstream vehiculos_backend.
            proxy_pass http://vehiculos_backend;
            # Preserva la cabecera Host original.
            proxy_set_header Host $host;
            # Envia la IP real del cliente.
            proxy_set_header X-Real-IP $remote_addr;
            # Actualiza X-Forwarded-For.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Informa el esquema original.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout breve de conexion (2 segundos) apropiado para sondas de salud.
            proxy_connect_timeout 2s;
            # Timeout acotado de lectura (5 segundos) para respuestas rapidas de Actuator.
            proxy_read_timeout 5s;
            # Conmutacion pasiva automatica hacia la instancia saludable ante fallo de la primera.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # Maximo 2 intentos entre los nodos configurados.
            proxy_next_upstream_tries 2;
        }

        # [Actividad 3 y Actividad 11 - P24/P25] Enrutamiento general por defecto (catalogo de vehiculos, reservas, etc.) hacia upstream ponderado 3:1.
        location / {
            # Reenvia el resto de rutas REST al grupo balanceado vehiculos_backend (:8080 weight=3 y :8082 weight=1).
            proxy_pass http://vehiculos_backend;
            # Preserva la cabecera Host original.
            proxy_set_header Host $host;
            # Envia la IP real del cliente.
            proxy_set_header X-Real-IP $remote_addr;
            # Actualiza la cadena X-Forwarded-For.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Propaga el esquema HTTP original.
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propaga el token Bearer JWT hacia Spring Security en las instancias de Vehiculos.
            proxy_set_header Authorization $http_authorization;

            # Timeout de conexion TCP con la instancia backend (2 segundos).
            proxy_connect_timeout 2s;
            # Timeout de lectura de respuesta de negocio (15 segundos).
            proxy_read_timeout 15s;

            # [Actividad 3 y Actividad 11 - P25] Reintento automatico (failover pasivo) sobre el siguiente upstream sano en caso de error, timeout o 502/503/504.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # Permite como maximo 2 intentos (una vez por cada instancia disponible del upstream).
            proxy_next_upstream_tries 2;
        }
    }
}
