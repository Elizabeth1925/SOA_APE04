# ============================================================================
# CONFIGURACION PRINCIPAL DE ALEMBIC
# ============================================================================
[alembic]
# Ubicacion de los scripts del entorno de migraciones relativo al directorio actual
script_location = %(here)s/alembic

# Agrega la ruta actual a sys.path para poder importar modulos de la aplicacion (app)
prepend_sys_path = .

# Separador de rutas dependiente del sistema operativo
path_separator = os

# URL de conexion por defecto utilizada por Alembic para conectarse a la base de datos MySQL
sqlalchemy.url = mysql+pymysql://root@localhost/venta_vehiculos

# Ganchos de post-escritura al generar nuevas migraciones
[post_write_hooks]

# ============================================================================
# CONFIGURACION DE REGISTRO (LOGGING)
# ============================================================================
# Lista de loggers configurados
[loggers]
keys = root,sqlalchemy,alembic

# Manejadores de salida para los logs
[handlers]
keys = console

# Formateadores para los mensajes de salida de log
[formatters]
keys = generic

# Nivel de log para el logger raiz
[logger_root]
level = WARNING
handlers = console
qualname =

# Nivel de log para el motor de consultas de SQLAlchemy
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Nivel de log para las operaciones propias de Alembic
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Configuracion del manejador que imprime logs hacia la consola (salida estandar de errores)
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Formato de visualizacion para los registros de log
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
