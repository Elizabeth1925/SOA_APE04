# ==============================================================================
# ARCHIVO: application.properties
# COMPONENTE: monitor-balancer-service (Microservicio Spring Boot - Puerto 8083)
# ROL: Configura el servicio independiente de observabilidad, el catalogo de
#      destinos sondeados cada 5 segundos, los timeouts finitos del cliente HTTP
#      y la ruta hacia el archivo access.log generado por NGINX.
# ACTIVIDADES APE 04 CUBIERTAS:
#   - [Actividad 3]: Observabilidad independiente en puerto 8083 fuera del flujo
#     transaccional de negocio; monitoreo de /nginx-ping (:8090) y
#     /actuator/health (:8080 y :8082) con timeouts acotados.
#   - [Actividad 11 - P23/P24/P25/P26]: Parametrizacion base para verificar
#     salud normal (P23), balanceo ponderado 3:1 (P24), estado DEGRADADO y
#     failover ante caida de una instancia (P25) y recuperacion a NORMAL (P26).
# ==============================================================================

# [Actividad 3] Nombre logico del microservicio independiente de monitoreo de balanceo.
spring.application.name=monitor-balancer-service
# [Actividad 3] Puerto HTTP dedicado (8083) separado de NGINX (:8090), Vehiculos (:8080/:8082), FastAPI (:8002) y Notificaciones (:8081).
server.port=8083

# [Actividad 3 y Actividad 11 - P23/P25/P26] Catalogo de destinos monitoreados cada 5 segundos por MonitorService.
# Endpoint local de diagnostico de NGINX que responde HTTP 200 con JSON {"status":"UP",...}.
monitor.destinos.nginx.url=http://127.0.0.1:8090/nginx-ping
# Endpoint de salud Spring Boot Actuator de la Instancia A de Vehiculos (peso 3 en NGINX).
monitor.destinos.instancia-a.url=http://127.0.0.1:8080/actuator/health
# Puerto logico de la Instancia A usado tanto en el reporte de instancias como para identificar trafico en access.log.
monitor.destinos.instancia-a.puerto=8080
# Endpoint de salud Spring Boot Actuator de la Instancia B de Vehiculos (peso 1 en NGINX).
monitor.destinos.instancia-b.url=http://127.0.0.1:8082/actuator/health
# Puerto logico de la Instancia B usado tanto en el reporte de instancias como para identificar trafico en access.log.
monitor.destinos.instancia-b.puerto=8082

# [Actividad 3 y Actividad 11 - P25] Configuracion de timeouts finitos del cliente HTTP (2 segundos = 2000 ms) para evitar bloqueos cuando un nodo cae.
# Tiempo maximo en milisegundos para abrir la conexion TCP hacia cada destino monitoreado.
monitor.client.connect-timeout-ms=2000
# Tiempo maximo en milisegundos esperando la respuesta HTTP completa de /nginx-ping o /actuator/health.
monitor.client.read-timeout-ms=2000

# [Actividad 3 y Actividad 11 - P24/P25] Ruta configurable del archivo de logs de NGINX (formato monitor_format) analizado por NginxLogParserService.
monitor.nginx.log-path=C:/nginx/logs/access.log
